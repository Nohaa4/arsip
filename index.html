<!-- PROGRAM -->
<section id="programPage" class="hidden">
  <section class="panel">
    <div class="panel-head management-head">
      <div>
        <h2>Daftar Program</h2>
        <p id="programCountLabel">Menampilkan data program.</p>
      </div>
      <button class="btn btn-primary" id="addProgramBtn">
        + Tambah Program
      </button>
    </div>

    <div class="table-wrap">
      <table class="management-table">
        <thead>
          <tr>
            <th>No.</th>
            <th>Nama Program</th>
            <th>Keterangan</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="programList"></tbody>
      </table>
    </div>

    <div id="programEmpty" class="empty-state hidden">
      Belum ada data program.
    </div>
  </section>
</section>
